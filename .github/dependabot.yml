version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-deps:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      backend-deps:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /ai-service
    schedule:
      interval: weekly
      day: monday
    groups:
      ai-deps:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
